<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Video Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .page-wrap { max-width: 900px; margin: 0 auto; padding: 28px 24px 70px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  @media (max-width: 480px) { .page-wrap { padding: 20px 16px 56px; } }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <a class="back-link" href="index.html">&larr; Pyramid Prism Prep</a>
      <h1>AP Video Library</h1>
      <p class="subtitle">Every unit video in one player. Pick one from the shelf below.</p>
    </div>
  </div>

  <div class="card">
    <div class="video-embed">
      <iframe id="playerFrame" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <a class="watch-yt-link" id="watchLink" href="#" target="_blank" rel="noopener">&#9654; Watch on YouTube &#8599;</a>
    <p class="watch-yt-hint">If the player above doesn't load, use the link to open it directly on YouTube.</p>
    <span class="now-playing-chip" id="nowPlayingChip"></span>
    <h2 id="nowPlayingTitle" style="margin:2px 0 8px;"></h2>
    <p id="nowPlayingBlurb" style="color:var(--text-muted); font-size:14px; line-height:1.6; margin:0 0 10px;"></p>
    <a id="openUnitLink" href="#" target="_blank" rel="noopener">Open full unit &amp; quiz &rarr;</a>
  </div>

  <div id="playlist"></div>
</div>

<script src="js/particles.js"></script>
<script>
  document.body.classList.add("ready");

  const VIDEOS = [
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 1", unitId: 1, title: "Chemistry of Life", videoId: "X1idfNwjJYU",
      blurb: "Water's polarity and hydrogen bonding, the four major macromolecules, dehydration synthesis vs. hydrolysis, and how enzymes lower activation energy." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 2", unitId: 2, title: "Cell Structure and Function", videoId: "h0JkytGr07o",
      blurb: "The fluid mosaic membrane, passive vs. active transport, key organelles, the endosymbiotic theory, and surface-area-to-volume ratio." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 3", unitId: 3, title: "Cellular Energetics", videoId: "AOtJk7pq0bs",
      blurb: "Photosynthesis's light reactions and Calvin cycle, plus glycolysis, the Krebs cycle, and oxidative phosphorylation in cellular respiration." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 4", unitId: 4, title: "Cell Communication and Cell Cycle", videoId: "_Ad5WG_R0j8",
      blurb: "Signal transduction (reception, transduction, response), cell cycle checkpoints, mitosis vs. meiosis, and apoptosis." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 5", unitId: 5, title: "Heredity", videoId: "JwQpAU9SQRM",
      blurb: "Mendel's laws of segregation and independent assortment, non-Mendelian inheritance, linked genes, and nondisjunction." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 6", unitId: 6, title: "Gene Expression and Regulation", videoId: "iNE_t7lodfs",
      blurb: "The central dogma, transcription and translation, the lac operon, mutations, and eukaryotic gene regulation." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 7", unitId: 7, title: "Natural Selection", videoId: "eeMCQstdr70",
      blurb: "Evidence for evolution, Hardy-Weinberg equilibrium, patterns of selection, speciation, and genetic drift." },
    { subjectKey: "biology", subject: "AP Biology", color: "#2f9e6e", unit: "Unit 8", unitId: 8, title: "Ecology", videoId: "jBrepVbmNG4",
      blurb: "Energy flow through trophic levels, population growth models, species interactions, and biogeochemical cycles." },
    { subjectKey: "world", subject: "AP World History", color: "#c1552c", unit: "Unit 1", unitId: 1, title: "The Global Tapestry (1200–1450)", videoId: "xDkPq5KcbS4",
      blurb: "Song China, the Dar al-Islam, Sub-Saharan African states, Mesoamerican and Andean societies, and feudal Europe before 1450." },
    { subjectKey: "calcbc", subject: "AP Calculus BC", color: "#3a6ea5", unit: "Unit 1", unitId: 1, title: "Limits and Continuity", videoId: "SVb9OV0bLzI",
      blurb: "Estimating and evaluating limits, one-sided limits, continuity, the Intermediate Value Theorem, and types of discontinuities." }
  ];

  let currentIndex = 0;

  function embedUrl(id) { return "https://www.youtube.com/embed/" + id + "?rel=0"; }
  function playIcon() {
    return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="rgba(0,0,0,0.35)"/><path d="M9.5 7.5v9l7-4.5z" fill="white"/></svg>';
  }

  const frame = document.getElementById("playerFrame");
  const watchLink = document.getElementById("watchLink");
  const chip = document.getElementById("nowPlayingChip");
  const titleEl = document.getElementById("nowPlayingTitle");
  const blurbEl = document.getElementById("nowPlayingBlurb");
  const openUnitLink = document.getElementById("openUnitLink");
  const playlistEl = document.getElementById("playlist");

  function playVideo(index) {
    currentIndex = index;
    const v = VIDEOS[index];
    frame.src = embedUrl(v.videoId);
    watchLink.href = "https://www.youtube.com/watch?v=" + v.videoId;
    chip.style.setProperty("--chip-color", v.color);
    chip.textContent = v.subject + " · " + v.unit;
    titleEl.textContent = v.title;
    blurbEl.textContent = v.blurb;
    openUnitLink.href = "https://pyramidprismprep.com/#/ap/" + v.subjectKey + "/" + v.unitId;
    document.querySelectorAll(".video-card").forEach((card, i) => {
      card.classList.toggle("active", i === index);
      card.setAttribute("aria-pressed", i === index ? "true" : "false");
    });
  }

  function buildPlaylist() {
    const groups = [];
    VIDEOS.forEach((v, i) => {
      let group = groups.find((g) => g.subject === v.subject);
      if (!group) { group = { subject: v.subject, color: v.color, items: [] }; groups.push(group); }
      group.items.push({ ...v, index: i });
    });

    playlistEl.innerHTML = groups.map((group) => `
      <div class="playlist-group">
        <div class="playlist-group-label" style="--group-color:${group.color}">${group.subject} &middot; ${group.items.length} video${group.items.length === 1 ? "" : "s"}</div>
        <div class="playlist-grid">
          ${group.items.map((v) => `
            <button type="button" class="video-card" style="--card-color:${v.color}" data-index="${v.index}" aria-pressed="false">
              <div class="video-thumb-wrap">
                <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" alt="${v.title}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="thumb-fallback">${playIcon()}</div>
                <div class="play-badge">${playIcon()}</div>
              </div>
              <div class="video-card-body">
                <span class="unit-tag">${v.unit}</span>
                <h4>${v.title}</h4>
              </div>
            </button>
          `).join("")}
        </div>
      </div>
    `).join("");

    playlistEl.querySelectorAll(".video-card").forEach((card) => {
      card.addEventListener("click", () => {
        playVideo(Number(card.dataset.index));
        document.querySelector(".video-embed").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  buildPlaylist();
  playVideo(0);
</script>
</body>
</html>
